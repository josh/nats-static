image:
  repository: ghcr.io/josh/nats-static
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Replica count; 2+ for HA (independent of nack.objectStore.replicas below).
replicaCount: 2

# Application config, rendered to config.json. Auth file paths are injected from
# the `secrets` block below — don't set them here.
config:
  nats:
    url: "nats://nats:4222"
  object_store:
    bucket: "static" # bucket to serve; provisioned externally, the server only opens it
  http:
    listen: ":8080"
  multipart:
    idle_timeout: "30s" # abort a chunked-upload session stalled this long
    max_sessions: 64 # cap on concurrent uploads per replica (bounds memory)

nack:
  # Render NACK CRDs to provision the object store (needs the NACK controller).
  # Off by default; otherwise create the bucket yourself — the server never does.
  enabled: false
  objectStore:
    storage: file
    replicas: 3 # data copies across NATS nodes (not replicaCount); <= node count
  # Optionally render a NACK Account CRD so the ObjectStore targets a non-default
  # account (connection config only; doesn't create the account server-side).
  account:
    name: "" # Account name; "" disables rendering.
    servers: [] # defaults to [ config.nats.url ]

# Kubernetes Secrets this chart references (you create them). Each auth method
# nests `secret: {name}` + key(s); secret.name defaults to "<fullname>-secrets".
secrets:
  # App NATS auth: populate exactly one method (else anonymous). Keys are mounted
  # to files and the matching nats.*_file path is injected into config.json.
  nats:
    token: # -> nats.token_file
      secret:
        name: ""
      token: "" # key holding the token
    user: # -> nats.user_file + nats.password_file
      secret:
        name: ""
      user: "" # key holding the username
      password: "" # key holding the password
    creds: # -> nats.creds_file
      secret:
        name: ""
      file: "" # key holding the nsc creds file
    nkey: # -> nats.nkey_seed_file
      secret:
        name: ""
      seed: "" # key holding the nkey seed

  # Auth for the NACK Account CRD (used when nack.account.name is set). Empty =
  # reuse secrets.nats; populate one method to override.
  nack:
    token:
      secret:
        name: ""
      token: ""
    user:
      secret:
        name: ""
      user: ""
      password: ""
    creds:
      secret:
        name: ""
      file: ""
    nkey:
      secret:
        name: ""
      seed: ""

service:
  type: ClusterIP
  port: 80

# No Ingress is rendered by this chart — it stays ingress-agnostic. Point your
# own Ingress at the Service's `http` port.

# Pod NetworkPolicies, split by direction so each can be enabled independently.
# Both are off by default, so upgrading an existing release changes nothing.
#
# Enabling a direction makes it an allowlist — there is no permit-everything
# mode, because a policy that allows every peer still punches through a
# namespace-wide default deny for these pods. The chart fails rendering if an
# enabled direction has no peers, rather than deploying a server nothing can
# reach or one that cannot reach NATS.
networkPolicy:
  ingress:
    # Creates an ingress policy for the server pods.
    enabled: false
    # NetworkPolicyPeer entries allowed to reach the http port, typically a
    # selector for your ingress controller. Required when enabled.
    from: []
  egress:
    # Creates an egress policy for the server pods. DNS is always included:
    # the server cannot resolve config.nats.url without it.
    enabled: false
    # NetworkPolicyPeer entries limiting where DNS may be sent. Empty leaves the
    # rule destination-agnostic, so it works with CoreDNS, kube-dns, and
    # node-local DNS without assuming cluster-specific labels or addresses.
    dnsTo: []
    # Egress to config.nats.url. NetworkPolicy is L3/L4-only and cannot resolve
    # a URL, so name the peers yourself; port must match the one in the URL.
    nats:
      to: []
      port: 4222
    # Complete NetworkPolicyEgressRule entries for any other destination.
    extraRules: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
