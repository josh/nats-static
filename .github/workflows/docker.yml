name: Docker

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@3415a188caae9a0da7fba83bc06985776e0b1790 # v1.14.0
    with:
      output: local
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
